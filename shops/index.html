<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHOPS</title>
<meta name="description" content="Scenic fabrication for film, television and installation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e7dac4'/%3E%3Cellipse cx='19' cy='22' rx='9' ry='5' fill='%23241c17' opacity='.3'/%3E%3Crect x='6' y='8' width='16' height='11' fill='%2393b9d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   SHOPS — cut paper, warm ground, one cool sky, and a light
   source that cannot be trusted.

   Everything here hangs off two numbers: --sun-x and --sun-y,
   a unit vector for where the light is coming from. Every
   shadow on the page is calc()'d off that pair. Each section
   declares its own sun angle; changing section tweens the
   vector, so every shadow in view swings at once. That swing
   is the transition — the composition is lit from somewhere
   new, and the paper follows.
   ───────────────────────────────────────────────────────── */

@property --sun-x { syntax: '<number>'; inherits: true; initial-value: 0.62; }
@property --sun-y { syntax: '<number>'; inherits: true; initial-value: 0.78; }

:root{
  /* ── ground: warm, earthy, opaque. Nothing here is grey. ── */
  --plaster:    #e7dac4;   /* the tabletop everything sits on */
  --plaster-lo: #dbc9ac;   /* its shaded half */
  --paper:      #f4ecdf;   /* a fresh sheet, top of the pile */
  --paper-lo:   #e8dac2;   /* an older sheet, further down */
  --sand:       #d2b993;
  --clay:       #b96f45;   /* terracotta — the working accent */
  --rust:       #8d472a;
  --umber:      #6b4a33;
  --soot:       #241c17;   /* type. warm black, never neutral */
  --soot-rgb:   36, 28, 23;
  --faded:      #7a6a5b;   /* secondary type */

  /* ── the one cool thing on the site ── */
  --sky:        #93b9d6;
  --sky-lo:     #6f9dc0;

  --display-font: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  --body-font:    'Jost', 'Futura', system-ui, sans-serif;

  --sun-x: 0.62;
  --sun-y: 0.78;
  --sun-tween: 1100ms;

  --rail-w: 232px;
  --edge: clamp(20px, 4vw, 64px);

  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }
body{
  margin: 0;
  font-family: var(--body-font);
  color: var(--soot);
  background: var(--plaster);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* The ground is not flat colour — it is lit from wherever the
   sun currently is, so even the empty table turns over when a
   section changes. */
body::before{
  content:'';
  position: fixed; inset: -20%;
  background:
    radial-gradient(120% 90% at
      calc(50% - var(--sun-x) * 34%)
      calc(50% - var(--sun-y) * 34%),
      #f0e5d1 0%, var(--plaster) 46%, var(--plaster-lo) 100%);
  transition: background var(--sun-tween) cubic-bezier(.4,0,.2,1);
  z-index: 0;
}

/* Paper tooth. One turbulence, multiplied over the whole
   surface, so flat fills read as stock rather than as CSS. */
body::after{
  content:'';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 90;
  opacity: .34;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='180' height='180' filter='url(%23g)' opacity='.42'/></svg>");
}

/* ─────────────────────────────────────────────────────────────
   THE SHEET
   One component. A rectangle of stock with real thickness: a
   lit edge on the side facing the sun, a hard contact shadow
   where it meets the surface below, and two softer casts for
   the air between. --lift says how many sheets up it sits.
   ───────────────────────────────────────────────────────── */
.sheet{
  --lift: 2;
  --sx: var(--sun-x);
  --sy: var(--sun-y);
  position: relative;
  background: var(--paper);
  box-shadow:
    /* the lit edge — thickness of the stock, facing the light */
    inset calc(var(--sx) * -1.5px) calc(var(--sy) * -1.5px) 0 rgba(255,253,247,.62),
    /* contact: hard, no blur. This is what makes it cut, not drawn. */
    calc(var(--sx) * var(--lift) * 2px) calc(var(--sy) * var(--lift) * 2px) 0 rgba(var(--soot-rgb), .07),
    calc(var(--sx) * var(--lift) * 5px) calc(var(--sy) * var(--lift) * 5px) calc(var(--lift) * 5px) rgba(var(--soot-rgb), .15),
    calc(var(--sx) * var(--lift) * 9px) calc(var(--sy) * var(--lift) * 9px) calc(var(--lift) * 13px) rgba(var(--soot-rgb), .10);
  transition:
    transform 620ms cubic-bezier(.22,.9,.3,1),
    /* the shadow is always a beat behind the paper */
    box-shadow 620ms cubic-bezier(.22,.9,.3,1) 130ms;
}

/* Lift levels. */
.sheet.l1 { --lift: 1; }
.sheet.l3 { --lift: 3; }
.sheet.l4 { --lift: 4; }
.sheet.l6 { --lift: 6; }

/* ── The light is not consistent, and nobody mentions it. ──
   .contra is lit from behind, .cross from ninety degrees off.
   Every section carries at least one. Look straight at it and
   it is obviously wrong; look at the page and it just reads as
   depth. */
.contra { --sx: calc(var(--sun-x) * -1); --sy: calc(var(--sun-y) * -1); }
.cross  { --sx: calc(var(--sun-y) * -1); --sy: var(--sun-x); }

/* Stock variants — same cut, different paper. */
.sheet.kraft { background: var(--paper-lo); }
.sheet.card  { background: var(--sand); }
.sheet.blue  { background: var(--sky); }
.sheet.clay  { background: var(--clay); color: #fdf6ea; }
.sheet.soot  { background: var(--soot); color: var(--paper); }
.sheet.soot  { box-shadow:
    inset calc(var(--sx) * -1.5px) calc(var(--sy) * -1.5px) 0 rgba(255,253,247,.16),
    calc(var(--sx) * var(--lift) * 2px) calc(var(--sy) * var(--lift) * 2px) 0 rgba(var(--soot-rgb), .10),
    calc(var(--sx) * var(--lift) * 5px) calc(var(--sy) * var(--lift) * 5px) calc(var(--lift) * 5px) rgba(var(--soot-rgb), .20),
    calc(var(--sx) * var(--lift) * 9px) calc(var(--sy) * var(--lift) * 9px) calc(var(--lift) * 13px) rgba(var(--soot-rgb), .13); }

/* ─────────────────────────────────────────────────────────────
   TYPE — geometric, deadpan. It states things; it doesn't
   perform them. Everything structural is tracked capitals.
   ───────────────────────────────────────────────────────── */
h1, h2, h3, .display { font-family: var(--display-font); font-weight: 600; margin: 0; }
.eyebrow{
  font-size: 11px; font-weight: 500; letter-spacing: .34em;
  text-transform: uppercase; color: var(--faded);
}
.rule{ height: 1px; background: rgba(var(--soot-rgb), .22); border: 0; margin: 0; }
p { margin: 0 0 1em; line-height: 1.62; }
p:last-child { margin-bottom: 0; }
a { color: inherit; }

.plate-head{ margin-bottom: 26px; }
.plate-head h2{
  font-size: clamp(30px, 4.4vw, 56px);
  letter-spacing: -.02em; line-height: .96; margin: 6px 0 10px;
}
.plate-head .sub{ font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--faded); }

/* ─────────────────────────────────────────────────────────────
   THE RAIL — navigation as a stack of index tabs down the
   left edge. Each tab is its own sheet, so the nav is made of
   the same material as the work.
   ───────────────────────────────────────────────────────── */
.rail{
  position: fixed; z-index: 40;
  left: var(--edge); top: 50%; transform: translateY(-50%);
  width: var(--rail-w);
  display: flex; flex-direction: column; gap: 9px;
}
.rail-mark{
  font-family: var(--display-font); font-weight: 700;
  font-size: 20px; letter-spacing: .3em; margin-bottom: 16px;
  padding-left: 2px;
}
.rail-mark small{
  display: block; font-size: 10px; font-weight: 400;
  letter-spacing: .26em; color: var(--faded); margin-top: 5px;
}
.tab{
  --lift: 1;
  display: flex; align-items: baseline; gap: 12px;
  padding: 13px 16px; border: 0; width: 100%;
  font: inherit; font-size: 13px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase;
  text-align: left; cursor: pointer;
  background: var(--paper-lo); color: var(--faded);
}
.tab .n{ font-size: 10px; letter-spacing: .1em; opacity: .6; }
.tab:hover{ --lift: 2; transform: translate(calc(var(--sun-x) * -2px), calc(var(--sun-y) * -2px)); color: var(--soot); }
.tab.on{
  --lift: 4; background: var(--paper); color: var(--soot);
  transform: translate(calc(var(--sun-x) * -5px), calc(var(--sun-y) * -5px));
}
.tab.on .n{ color: var(--clay); opacity: 1; }
.tab:focus-visible{ outline: 2px solid var(--clay); outline-offset: 3px; }

/* ─────────────────────────────────────────────────────────────
   THE TABLE + PLATES
   One composition at a time. Plates stack in the same space;
   only one is on. Pieces inside fly in on a stagger and their
   shadows arrive late — for about a tenth of a second a piece
   sits on the table casting nothing at all.
   ───────────────────────────────────────────────────────── */
.table{
  position: fixed; z-index: 20;
  inset: 0 0 0 calc(var(--rail-w) + var(--edge) * 2);
  padding: var(--edge) var(--edge) var(--edge) 0;
}
.plate{
  position: absolute; inset: 0;
  padding: var(--edge) var(--edge) var(--edge) 0;
  overflow-y: auto; overflow-x: hidden;
  opacity: 0; pointer-events: none;
  scrollbar-width: thin;
  scrollbar-color: rgba(var(--soot-rgb), .28) transparent;
}
.plate.on{ opacity: 1; pointer-events: auto; }
/* An exiting plate stays visible while its pieces leave — fading
   the whole plate would cut the exit off at the first frame. */
.plate.out{ opacity: 1; pointer-events: none; }
.plate::-webkit-scrollbar{ width: 9px; }
.plate::-webkit-scrollbar-thumb{ background: rgba(var(--soot-rgb), .26); }
.plate-inner{ max-width: 1120px; padding-bottom: 40px; }
/* A composition that is meant to be looked at whole — the title
   card, the contact slate — centres in the plate instead of
   stacking from the top. */
.plate-inner.centred{
  display: flex; flex-direction: column; justify-content: center;
  min-height: 100%; padding-bottom: 0;
}

/* A piece is anything the composition is assembled from. It
   enters from an offset that alternates by index, so the
   collage rebuilds itself rather than fading up. */
.piece{
  --i: 0;
  --ox: 0px; --oy: 26px; --orot: 0deg;
  opacity: 0;
  transform: translate(var(--ox), var(--oy)) rotate(var(--orot));
  transition: opacity 520ms ease, transform 640ms cubic-bezier(.2,.86,.3,1);
}
.plate.on .piece{
  opacity: 1;
  transform: none;
  transition-delay: calc(var(--i) * 62ms + 90ms);
}
/* Exit: the pieces are blown along the current light. The
   plate leaves in the direction the sun is pointing. */
.plate.out .piece{
  opacity: 0;
  transform: translate(calc(var(--sun-x) * 70px), calc(var(--sun-y) * 70px)) rotate(calc(var(--orot) * -1));
  transition-duration: 340ms, 380ms;
  transition-delay: calc(var(--i) * 26ms);
}
.piece:nth-child(even){ --ox: -22px; --orot: .5deg; }
.piece:nth-child(3n){ --ox: 20px; --oy: 34px; --orot: -.45deg; }

/* ── The signature. A flat sky-blue rectangle whose shadow is
   a cloud. Nothing casts it; it is simply the shadow that
   rectangle has. It recurs at three sizes across the site. ── */
.cloudplate{ position: relative; display: inline-block; }
.cloudplate .face{
  position: relative; z-index: 2;
  display: block; background: var(--sky);
  box-shadow: inset calc(var(--sun-x) * -1.5px) calc(var(--sun-y) * -1.5px) 0 rgba(255,255,255,.5);
}
.cloudplate .cast{
  position: absolute; z-index: 1; inset: 0;
  opacity: .34;
  filter: blur(2.5px);
  transform: translate(calc(var(--sun-x) * 52px), calc(var(--sun-y) * 52px)) scale(1.24);
  transition: transform 700ms cubic-bezier(.22,.9,.3,1) 160ms;
}
/* The cloud is built from four opaque lobes rather than masked
   out of one shape: opaque siblings overlap without darkening
   each other, so the group blurs and fades as a single object.
   Percentages, so it scales with whatever .face is set to. */
.cloudplate .cast i{ position: absolute; display: block; background: #3a2a1c; border-radius: 50%; }
.cloudplate .cast i:nth-child(1){ left:  7%; top: 30%; width: 38%; height: 64%; }
.cloudplate .cast i:nth-child(2){ left: 27%; top:  2%; width: 48%; height: 84%; }
.cloudplate .cast i:nth-child(3){ left: 56%; top: 28%; width: 37%; height: 62%; }
.cloudplate .cast i:nth-child(4){ left: 10%; top: 50%; width: 79%; height: 36%; border-radius: 999px; }

/* ─────────────────────────────────────────────────────────────
   MOUNTED PRINTS
   Photographs are never bare — they sit on a mount with a
   border, the way a print sits on card. One grade holds every
   image in the palette so photography and paper agree.
   ───────────────────────────────────────────────────────── */
:root{ --grade: saturate(.84) contrast(1.05) sepia(.14) brightness(1.02); }
.frame{ --lift: 3; padding: 10px 10px 0; background: var(--paper); }
.frame .shot, .job .shot{
  position: relative; display: block; width: 100%;
  aspect-ratio: 4 / 3; overflow: hidden; background: var(--paper-lo);
}
.frame .shot img, .frame .shot video, .frame .shot iframe,
.job .shot img, .job .shot video, .job .shot iframe{
  width: 100%; height: 100%; object-fit: cover; display: block;
  border: 0; filter: var(--grade);
}
.frame .shot.natural{ aspect-ratio: auto; }
/* A face wants a portrait crop; 4:3 puts the lower third across
   the subject's mouth. */
.portrait .frame .shot{ aspect-ratio: 4 / 5; }
.frame .shot.natural img{ height: auto; max-height: 58vh; object-fit: contain; }
.frame .cap{
  padding: 9px 2px 10px; font-size: 10.5px; letter-spacing: .17em;
  text-transform: uppercase; color: var(--faded);
}
.frame .shot .none, .job .shot .none{
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10px; letter-spacing: .3em; color: var(--faded);
  background: repeating-linear-gradient(45deg, var(--paper-lo) 0 9px, var(--sand) 9px 18px);
}

/* ─────────────────────────────────────────────────────────────
   CH 01 — THE TITLE PLATE
   Name on the left, a pile of prints on the right, and one
   rectangle of sky with a cloud for a shadow.
   ───────────────────────────────────────────────────────── */
.title-plate{ display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 5vw, 72px); align-items: center; min-height: 100%; }
.title-copy{ max-width: 34em; }
.bigname{
  font-size: clamp(52px, 9.5vw, 132px);
  line-height: .84; letter-spacing: -.035em; font-weight: 700;
  margin: 14px 0 20px;
  /* type is printed, not floating: it carries the same light */
  text-shadow:
    calc(var(--sun-x) * 3px) calc(var(--sun-y) * 3px) 0 rgba(var(--soot-rgb), .13),
    calc(var(--sun-x) * 9px) calc(var(--sun-y) * 9px) 14px rgba(var(--soot-rgb), .12);
  transition: text-shadow var(--sun-tween) cubic-bezier(.4,0,.2,1);
}
.title-copy .lede{ font-size: clamp(15px, 1.5vw, 18px); color: #453a30; }
.title-strip{ display: inline-block; margin-top: 26px; padding: 12px 20px; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }

/* The pile: prints dropped on the table, squared up by hand
   and not quite square. Top one is the one you're looking at. */
.pile{ position: relative; aspect-ratio: 4 / 3.4; width: 100%; max-width: 560px; margin-left: auto; }
.print{
  position: absolute; inset: 0; cursor: pointer;
  transition: transform 720ms cubic-bezier(.24,.9,.3,1),
              opacity 420ms ease,
              box-shadow 720ms cubic-bezier(.24,.9,.3,1) 150ms;
}
.print[data-slot="0"]{ --lift: 6; transform: rotate(-1.1deg); z-index: 4; }
.print[data-slot="1"]{ --lift: 4; transform: rotate(2.2deg) translate(16px, 12px) scale(.975); z-index: 3; }
.print[data-slot="2"]{ --lift: 3; transform: rotate(-3.4deg) translate(-14px, 22px) scale(.955); z-index: 2; }
.print[data-slot="3"]{ --lift: 2; transform: rotate(1.4deg) translate(6px, 32px) scale(.935); z-index: 1; }
.print[data-slot="x"]{ --lift: 1; transform: rotate(0deg) translateY(40px) scale(.92); opacity: 0; z-index: 0; pointer-events: none; }
.print[data-slot="0"]:hover{ transform: rotate(-1.1deg) translate(calc(var(--sun-x) * -7px), calc(var(--sun-y) * -7px)); }
.pile-count{
  position: absolute; right: -6px; bottom: -30px; z-index: 5;
  font-size: 10px; letter-spacing: .3em; color: var(--faded);
}
/* Sat over the pile the cloud had nowhere to fall — the joke
   only works on open ground, where the whole silhouette shows. */
.cloud-sig{ position: absolute; z-index: 6; left: -58px; bottom: -128px; }
.cloud-sig .face{ width: 140px; height: 80px; }
.cloud-sig .cast{ transform: translate(calc(var(--sun-x) * 68px), calc(var(--sun-y) * 68px)) scale(1.26); }

/* ─────────────────────────────────────────────────────────────
   WORK — a contact sheet of jobs.
   ───────────────────────────────────────────────────────── */
.filters{ display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.chip{
  --lift: 1; border: 0; padding: 9px 15px; cursor: pointer;
  font: inherit; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
  background: var(--paper-lo); color: var(--faded);
}
.chip:hover{ --lift: 2; color: var(--soot); }
.chip.on{ --lift: 3; background: var(--clay); color: #fdf4e8; transform: translate(calc(var(--sun-x) * -3px), calc(var(--sun-y) * -3px)); }
.chip:focus-visible{ outline: 2px solid var(--clay); outline-offset: 3px; }

.jobs{ display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: clamp(20px, 2.6vw, 34px); }
.job{ --lift: 3; padding: 10px 10px 0; background: var(--paper); text-align: left; border: 0; font: inherit; color: inherit; cursor: pointer; display: block; width: 100%; }
.job[data-flat="1"]{ cursor: default; }
.job:hover{ --lift: 6; transform: translate(calc(var(--sun-x) * -8px), calc(var(--sun-y) * -8px)); }
.job:focus-visible{ outline: 2px solid var(--clay); outline-offset: 4px; }
.job .meta{ padding: 11px 2px 14px; }
.job .jt{ font-family: var(--display-font); font-weight: 600; font-size: 15.5px; line-height: 1.2; }
.job .jr{ margin-top: 6px; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--faded); }
.job .jy{ color: var(--clay); }
.job .open{
  display: block; margin-top: 9px; font-size: 9.5px; letter-spacing: .26em;
  text-transform: uppercase; color: var(--clay); opacity: 0;
  transition: opacity 240ms ease;
}
.job:hover .open, .job:focus-visible .open{ opacity: 1; }

/* ── Detail: one job lifted clean off the pile. ── */
.lift{
  position: fixed; inset: 0; z-index: 70;
  display: grid; place-items: center; padding: clamp(14px, 3vw, 44px);
  background: rgba(58, 42, 30, .42);
  backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity 300ms ease;
}
.lift.open{ opacity: 1; pointer-events: auto; }
.lift-sheet{
  --lift: 6; width: min(880px, 100%); max-height: 100%;
  overflow-y: auto; padding: clamp(22px, 3vw, 40px);
  transform: translateY(26px) scale(.985);
  transition: transform 420ms cubic-bezier(.2,.86,.3,1);
}
.lift.open .lift-sheet{ transform: none; }
.lift-close{
  position: sticky; top: 0; float: right; margin: -8px -8px 0 0;
  border: 0; background: none; cursor: pointer; font: inherit;
  font-size: 10px; letter-spacing: .26em; color: var(--faded); padding: 6px;
}
.lift-close:hover{ color: var(--rust); }
.lift-sheet h3{ font-size: clamp(22px, 2.7vw, 32px); letter-spacing: -.015em; margin: 2px 0 14px; }
.gal{ position: relative; margin: 20px 0 24px; }
.gal-nav{ position: absolute; inset: 0; display: flex; z-index: 3; }
/* A natural-crop still is pillarboxed on paper, so white controls
   disappear on exactly the slides they sit over. The glyphs carry
   their own dark chip instead and read on stock or photograph. */
.gal-nav button{ flex: 1; border: 0; background: none; cursor: pointer; font: inherit;
  display: flex; align-items: center; padding: 0 14px;
  opacity: 0; transition: opacity 200ms ease; }
.gal-nav button:last-child{ justify-content: flex-end; }
.gal-nav button span{
  background: rgba(var(--soot-rgb), .72); color: #fdf4e8;
  font-size: 10px; letter-spacing: .2em; padding: 9px 12px;
}
.gal:hover .gal-nav button, .gal-nav button:focus-visible{ opacity: 1; }
.gal-count{ position: absolute; right: 12px; bottom: 13px; z-index: 4;
  font-size: 10px; letter-spacing: .2em; color: var(--faded); }

/* ── The slate: label / value rows. Shared by job detail,
   about, and contact, so facts look the same everywhere. ── */
.slate{ display: grid; grid-template-columns: auto 1fr; gap: 0 22px; margin: 18px 0; }
.slate dt{ font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--faded); padding: 9px 0; border-top: 1px solid rgba(var(--soot-rgb), .14); }
.slate dd{ margin: 0; padding: 9px 0; font-size: 14px; border-top: 1px solid rgba(var(--soot-rgb), .14); }
.body-copy{ max-width: 40em; font-size: 15px; }

/* ─────────────────────────────────────────────────────────────
   COMMISSIONS — what you can ask the shop for.
   ───────────────────────────────────────────────────────── */
.offers{ display: grid; gap: 16px; }
.offer{ --lift: 2; display: grid; grid-template-columns: 62px 1fr auto; gap: 0 24px; padding: 24px 26px; align-items: start; }
.offer:hover{ --lift: 4; transform: translate(calc(var(--sun-x) * -5px), calc(var(--sun-y) * -5px)); }
.offer .num{ font-family: var(--display-font); font-size: 30px; font-weight: 300; color: var(--clay); line-height: 1; }
.offer h3{ font-size: 20px; letter-spacing: -.01em; margin-bottom: 8px; }
.offer .blurb{ font-size: 14.5px; color: #4b3f34; max-width: 46em; }
.offer .points{ list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 7px; }
.offer .points li{ font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--faded); background: var(--paper-lo); padding: 6px 11px; }
.offer .lead-t{ font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faded); text-align: right; white-space: nowrap; }
.offers-note{ margin-top: 26px; padding: 20px 24px; font-size: 13.5px; }

/* ─────────────────────────────────────────────────────────────
   PROCESS — stages, laid out as a strip of cards that steps
   down the page. Even-numbered stages are lit from the wrong
   side; the sequence disagrees with itself about the time of
   day.
   ───────────────────────────────────────────────────────── */
.steps{ display: grid; gap: clamp(22px, 3vw, 40px); }
.step{ display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 3vw, 44px); align-items: center; }
.step:nth-child(even) .step-copy{ order: 2; }
.step-copy .n{ font-family: var(--display-font); font-size: 13px; letter-spacing: .3em; color: var(--clay); }
.step-copy h3{ font-size: clamp(21px, 2.4vw, 30px); letter-spacing: -.015em; margin: 10px 0 12px; }
.step-copy p{ font-size: 14.5px; color: #4b3f34; max-width: 34em; }

/* ─────────────────────────────────────────────────────────────
   ABOUT + CONTACT
   ───────────────────────────────────────────────────────── */
.about-plate{ display: grid; grid-template-columns: minmax(240px, .8fr) 1.2fr; gap: clamp(28px, 4vw, 60px); align-items: start; }
.portrait{ position: relative; }
.lower-third{
  position: absolute; left: 10px; right: 10px; bottom: 54px; z-index: 3;
  padding: 12px 16px; background: rgba(36,28,23,.86); color: var(--paper);
  border-left: 3px solid var(--clay);
}
.lower-third .nm{ font-family: var(--display-font); font-weight: 600; font-size: 17px; letter-spacing: .02em; }
.lower-third .rl{ font-size: 10px; letter-spacing: .24em; text-transform: uppercase; opacity: .75; margin-top: 4px; }

.contact-plate{ min-height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 780px; }
.card-rows{ margin: 26px 0 0; padding: 8px 30px 22px; }
.crow{ display: grid; grid-template-columns: 110px 1fr; gap: 20px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid rgba(var(--soot-rgb), .14); text-decoration: none; }
.crow:last-child{ border-bottom: 0; }
.crow .k{ font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--faded); }
.crow .v{ font-family: var(--display-font); font-size: clamp(19px, 2.4vw, 29px); letter-spacing: -.01em; }
a.crow:hover .v{ color: var(--rust); }
a.crow:hover .v::after{ content: ''; display: block; height: 2px; background: var(--clay); margin-top: 5px; }
.contact-note{ margin-top: 26px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--faded); }

/* Free-form blocks (custom sections). */
.block-text{ padding: 26px 30px; max-width: 46em; font-size: 15px; }
.block-img{ max-width: 700px; }

/* ─────────────────────────────────────────────────────────────
   THE SUNMARK
   A paper disc in the corner sitting where the light is
   coming from. It is the only object on the site that casts
   no shadow at all.
   ───────────────────────────────────────────────────────── */
.sunmark{
  position: fixed; z-index: 45; right: var(--edge); bottom: var(--edge);
  width: 74px; height: 74px; pointer-events: none;
  display: grid; place-items: center;
}
.sunmark .disc{
  width: 15px; height: 15px; border-radius: 50%; background: var(--sand);
  transform: translate(calc(var(--sun-x) * -22px), calc(var(--sun-y) * -22px));
  transition: transform var(--sun-tween) cubic-bezier(.4,0,.2,1);
}
.sunmark .ring{ position: absolute; inset: 0; border: 1px solid rgba(var(--soot-rgb), .18); border-radius: 50%; }
.sunmark .lbl{ position: absolute; bottom: -16px; right: 0; font-size: 8.5px; letter-spacing: .28em; color: var(--faded); }

/* ─────────────────────────────────────────────────────────────
   SMALLER TABLES
   Below 980px the rail lies down along the top and the plates
   take the full width. Below 620px the compositions unstack
   into single columns — a collage that needs two columns is
   not a collage on a phone.
   ───────────────────────────────────────────────────────── */
@media (max-width: 980px){
  :root{ --rail-w: 0px; }
  .rail{
    position: fixed; left: 0; right: 0; top: 0; transform: none;
    width: auto; flex-direction: row; gap: 6px;
    padding: 12px var(--edge); overflow-x: auto;
    background: linear-gradient(var(--plaster) 62%, rgba(231,218,196,0));
    align-items: center;
  }
  .rail-mark{ margin: 0 18px 0 0; font-size: 15px; white-space: nowrap; }
  .rail-mark small{ display: none; }
  .tab{ width: auto; white-space: nowrap; padding: 10px 14px; font-size: 11px; }
  .table{ inset: 74px 0 0 0; padding: 0; }
  /* .plate is absolutely positioned, so it sits inside .table's
     padding box and has to carry its own gutters here. */
  .plate{ padding: 12px var(--edge) 0; }
  .title-plate, .about-plate, .step{ grid-template-columns: 1fr; }
  .step:nth-child(even) .step-copy{ order: 0; }
  .pile{ margin: 30px auto 44px; }
  .cloud-sig{ left: -6px; bottom: -96px; }
  .cloud-sig .face{ width: 104px; height: 60px; }
  .sunmark{ display: none; }
}
@media (max-width: 620px){
  .offer{ grid-template-columns: 1fr; gap: 12px; }
  .offer .lead-t{ text-align: left; }
  .crow{ grid-template-columns: 1fr; gap: 5px; }
  .jobs{ grid-template-columns: 1fr 1fr; gap: 14px; }
  .job .jt{ font-size: 13.5px; }
}

/* Reduced motion: the paper stops flying, the sun stops
   travelling, the shadows stop arriving late. The material
   stays — depth was never the animation. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    transition-duration: 1ms !important;
    transition-delay: 0ms !important;
    animation-duration: 1ms !important;
  }
  .piece{ opacity: 1; transform: none; }
}
</style>
</head>
<body>

<nav class="rail" id="rail" aria-label="Sections"></nav>

<main class="table" id="table"></main>

<div class="sunmark" aria-hidden="true">
  <span class="ring"></span><span class="disc"></span><span class="lbl">LIGHT</span>
</div>

<div class="lift" id="lift" role="dialog" aria-modal="true" aria-label="Job detail" hidden>
  <div class="sheet lift-sheet" id="liftSheet"></div>
</div>

<noscript style="position:fixed;inset:0;display:grid;place-items:center;padding:40px;font-family:Jost,sans-serif;">
  This site assembles itself in the browser. Please enable JavaScript.
</noscript>

<script>
/* ═════════════════════════════════════════════════════════════
   SHOPS — the assembler.

   The page has no markup of its own worth speaking of. It
   fetches content.json, builds one plate per section, and
   hands each plate to a renderer keyed on its type. Adding a
   section type means one function here and one editor in
   admin.html — nothing else.
   ═════════════════════════════════════════════════════════ */

const $  = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── The light ────────────────────────────────────────────────
   `sun` is the angle the shadows fall, in degrees clockwise
   from straight down. 0 drops them below an object, 90 throws
   them to the right. Sections each declare one; tweening
   between them is the transition. */
const DEFAULT_SUN = 38;
function setSun(deg){
  const t = (Number.isFinite(+deg) ? +deg : DEFAULT_SUN) * Math.PI / 180;
  const r = document.documentElement.style;
  r.setProperty('--sun-x', Math.sin(t).toFixed(4));
  r.setProperty('--sun-y', Math.cos(t).toFixed(4));
}

/* ── Media ───────────────────────────────────────────────────
   A src is a local file, an mp4, or a video URL. One function
   decides which, everywhere. */
function mediaHtml(src){
  const s = String(src || '');
  let m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]+)/);
  if (m) return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(m[1])}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  m = s.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return `<iframe src="https://player.vimeo.com/video/${esc(m[1])}" allowfullscreen loading="lazy" title="Video"></iframe>`;
  if (/\.(mp4|webm|m4v)(\?|#|$)/i.test(s)) return `<video src="${esc(s)}" muted loop autoplay playsinline></video>`;
  return `<img src="${esc(s)}" alt="" loading="lazy">`;
}
function frameHtml(item, opts = {}){
  const it = item || {};
  const cls = ['sheet', 'frame', opts.cls].filter(Boolean).join(' ');
  /* Only a still can keep its own crop. A player with no aspect
     ratio collapses to nothing, so video always takes the frame. */
  const still = !/(?:youtube|youtu\.be|vimeo)|\.(?:mp4|webm|m4v)(?:\?|#|$)/i.test(String(it.src || ''));
  const shot = ['shot', opts.natural && still ? 'natural' : ''].filter(Boolean).join(' ');
  return `<figure class="${cls}" style="${opts.style || ''}">
    <div class="${shot}">${it.src ? mediaHtml(it.src) : '<span class="none">NOTHING HERE YET</span>'}</div>
    ${it.caption ? `<figcaption class="cap">${esc(it.caption)}</figcaption>` : '<div class="cap"></div>'}
  </figure>`;
}
function slateHtml(rows){
  const list = (rows || []).filter(r => r && (r.k || r.v));
  if (!list.length) return '';
  return `<dl class="slate">${list.map(r =>
    `<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>`).join('')}</dl>`;
}
function paras(arr){
  return (arr || []).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
}
function headHtml(sec, n){
  return `<header class="plate-head piece">
    <div class="eyebrow">${esc(String(n).padStart(2, '0'))} — ${esc(sec.label || '')}</div>
    <h2>${esc(sec.title || sec.label || '')}</h2>
    ${sec.sub ? `<div class="sub">${esc(sec.sub)}</div>` : ''}
  </header>`;
}
const cloudHtml = (cls) =>
  `<span class="cloudplate ${cls || ''}">
     <span class="cast"><i></i><i></i><i></i><i></i></span>
     <span class="face"></span>
   </span>`;

/* ── Renderers ─────────────────────────────────────────────── */
const RENDER = {};

RENDER.title = (sec) => {
  const prints = (sec.plates || []).filter(p => p && p.src);
  return `<div class="title-plate">
    <div class="title-copy">
      <div class="piece">
        ${sec.eyebrow ? `<div class="eyebrow">${esc(sec.eyebrow)}</div>` : ''}
        <h1 class="bigname">${esc(sec.name || 'SHOPS')}</h1>
        <hr class="rule">
      </div>
      <div class="piece lede body-copy" style="margin-top:22px">${paras(sec.paragraphs)}</div>
      ${sec.tagline ? `<div class="piece"><span class="sheet clay title-strip">${esc(sec.tagline)}</span></div>` : ''}
    </div>
    <div class="piece">
      <div class="pile" id="pile">
        ${cloudHtml('cloud-sig')}
        ${prints.map((p, i) => `<figure class="sheet frame print" data-slot="${i < 4 ? i : 'x'}" data-idx="${i}">
            <div class="shot">${mediaHtml(p.src)}</div>
            <figcaption class="cap">${esc(p.caption || '')}</figcaption>
          </figure>`).join('')}
        ${prints.length > 1 ? `<div class="pile-count">${prints.length} PRINTS — CLICK TO SHUFFLE</div>` : ''}
      </div>
    </div>
  </div>`;
};

RENDER.work = (sec, n) => {
  const items = sec.items || [];
  const kinds = [...new Set(items.map(i => (i.kind || '').trim()).filter(Boolean))];
  return `${headHtml(sec, n)}
    ${kinds.length > 1 ? `<div class="filters piece" id="filters">
      <button class="sheet chip on" data-kind="">ALL</button>
      ${kinds.map(k => `<button class="sheet chip" data-kind="${esc(k)}">${esc(k)}</button>`).join('')}
    </div>` : ''}
    <div class="jobs" id="jobs">${items.map(jobHtml).join('')}</div>`;
};
function jobHtml(job, i){
  const deep = !!(job.writeup || (job.gallery || []).length);
  const bits = [job.role, job.year].filter(Boolean).map(esc);
  return `<div class="piece" data-kind="${esc(job.kind || '')}">
    <button class="sheet job" data-job="${i}" data-flat="${deep ? 0 : 1}"${deep ? '' : ' tabindex="-1"'}>
      <div class="shot">${job.image ? mediaHtml(job.image) : '<span class="none">NOTHING HERE YET</span>'}</div>
      <div class="meta">
        <div class="jt">${esc(job.title || 'Untitled')}</div>
        <div class="jr">${bits.length ? bits[0] : ''}${job.year ? ` · <span class="jy">${esc(job.year)}</span>` : ''}</div>
        ${deep ? '<span class="open">Lift this one off the pile →</span>' : ''}
      </div>
    </button>
  </div>`;
}

RENDER.services = (sec, n) => `${headHtml(sec, n)}
  <div class="offers">
    ${(sec.items || []).map((o, i) => `<div class="piece"><article class="sheet offer">
      <div class="num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${esc(o.title || '')}</h3>
        <div class="blurb">${esc(o.blurb || '')}</div>
        ${(o.points || []).length ? `<ul class="points">${o.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      </div>
      <div class="lead-t">${esc(o.lead || '')}</div>
    </article></div>`).join('')}
  </div>
  ${sec.note ? `<div class="piece"><div class="sheet kraft offers-note contra">${esc(sec.note)}</div></div>` : ''}`;

RENDER.process = (sec, n) => `${headHtml(sec, n)}
  <div class="steps">
    ${(sec.steps || []).map((s, i) => `<div class="piece step">
      <div class="step-copy">
        <div class="n">STAGE ${String(i + 1).padStart(2, '0')}</div>
        <h3>${esc(s.title || '')}</h3>
        <p>${esc(s.text || '')}</p>
      </div>
      ${frameHtml(s, { cls: i % 2 ? 'cross' : '' })}
    </div>`).join('')}
  </div>`;

RENDER.about = (sec, n) => `${headHtml(sec, n)}
  <div class="about-plate">
    <div class="piece portrait">
      ${frameHtml(sec.portrait || {}, { cls: 'l4' })}
      ${sec.name ? `<div class="lower-third">
        <div class="nm">${esc(sec.name)}</div>
        ${sec.role ? `<div class="rl">${esc(sec.role)}</div>` : ''}
      </div>` : ''}
    </div>
    <div>
      <div class="piece">${slateHtml(sec.facts)}</div>
      <div class="piece body-copy">${paras(sec.paragraphs)}</div>
    </div>
  </div>`;

RENDER.contact = (sec, n) => `<div class="contact-plate">
    ${headHtml(sec, n)}
    <div class="piece"><div class="sheet card-rows l4">
      ${(sec.rows || []).map(r => {
        const inner = `<span class="k">${esc(r.k)}</span><span class="v">${esc(r.label)}</span>`;
        return r.href ? `<a class="crow" href="${esc(r.href)}">${inner}</a>` : `<div class="crow">${inner}</div>`;
      }).join('')}
    </div></div>
    ${slateHtml(sec.meta) ? `<div class="piece" style="max-width:420px">${slateHtml(sec.meta)}</div>` : ''}
    ${sec.note ? `<div class="piece contact-note">${esc(sec.note)}</div>` : ''}
  </div>`;

RENDER.custom = (sec, n) => `${headHtml(sec, n)}
  ${(sec.blocks || []).map(b => {
    if (b.kind === 'text')  return `<div class="piece"><div class="sheet block-text">${paras(String(b.text || '').split(/\n{2,}/))}</div></div>`;
    if (b.kind === 'image' || b.kind === 'video') return `<div class="piece block-img">${frameHtml(b, { natural: b.kind === 'image' })}</div>`;
    return '';
  }).join('')}`;

/* ═════════════════════════════════════════════════════════════
   THE DRIVER
   ═════════════════════════════════════════════════════════ */
let content = null, sections = [], plates = [], cur = -1, jobsOf = [];

const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

async function boot(){
  try {
    const res = await fetch('content.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    content = await res.json();
  } catch (err) {
    $('table').innerHTML = `<div class="plate on"><div class="sheet block-text" style="margin-top:40px">
      <p><strong>Could not load content.json.</strong></p>
      <p>Serve the folder over HTTP rather than opening the file directly —
      <code>python3 -m http.server</code> in this directory, then visit
      <code>localhost:8000</code>.</p>
      <p style="color:#7a6a5b">${esc(err.message)}</p></div></div>`;
    return;
  }

  sections = (content.sections || []).filter(s => s && RENDER[s.type]);
  document.title = content.site?.title || 'SHOPS';

  /* rail */
  $('rail').innerHTML = `<div class="rail-mark">${esc(content.site?.mark || 'SHOPS')}
      <small>${esc(content.site?.markSub || '')}</small></div>` +
    sections.map((s, i) => `<button class="sheet tab" data-go="${i}">
      <span class="n">${String(i + 1).padStart(2, '0')}</span>
      <span>${esc(s.label || 'SECTION')}</span></button>`).join('');
  $('rail').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) go(+b.dataset.go);
  });

  /* plates */
  $('table').innerHTML = sections.map((s, i) =>
    `<section class="plate" data-i="${i}" aria-label="${esc(s.label || '')}">
       <div class="plate-inner${s.type === 'title' || s.type === 'contact' ? ' centred' : ''}">${RENDER[s.type](s, i + 1)}</div>
     </section>`).join('');
  plates = [...document.querySelectorAll('.plate')];
  plates.forEach(number);

  /* deep link: #work lands on that section */
  const want = sections.findIndex(s => slug(s.label) === location.hash.slice(1));
  go(want >= 0 ? want : 0, { instant: true });
}

/* Give every piece its place in the queue, so a composition
   assembles in reading order instead of all at once. */
function number(plate){
  [...plate.querySelectorAll('.piece')].forEach((el, i) => el.style.setProperty('--i', i));
}

function go(i, { instant } = {}){
  if (i === cur || i < 0 || i >= plates.length) return;
  const prev = cur >= 0 ? plates[cur] : null;
  const next = plates[i];

  setSun(sections[i].sun);          /* the light moves first */
  cur = i;
  /* a sandboxed or file:// host can refuse this; the deep link is a
     convenience, not a dependency */
  try { history.replaceState(null, '', '#' + slug(sections[i].label)); } catch {}
  [...$('rail').querySelectorAll('.tab')].forEach((t, n) => t.classList.toggle('on', n === i));

  const land = () => {
    if (prev) prev.classList.remove('out');
    next.scrollTop = 0;
    number(next);
    next.classList.add('on');
    startPile(next);
  };

  if (prev) {
    prev.classList.remove('on');
    prev.classList.add('out');                     /* pieces blow away along the light */
    setTimeout(land, REDUCED || instant ? 0 : 360);
  } else {
    land();
  }
}

/* ── The pile of prints on the title plate ────────────────────
   Slots 0–3 are the visible stack; everything else waits
   underneath. Advancing sends the top print to the back. */
let pileTimer = null, pileOrder = [];
function startPile(plate){
  clearInterval(pileTimer);
  const pile = plate.querySelector('.pile');
  if (!pile) return;
  const prints = [...pile.querySelectorAll('.print')];
  if (prints.length < 2) return;
  pileOrder = prints.map((_, i) => i);
  const paint = () => prints.forEach((p, i) => {
    const slot = pileOrder.indexOf(i);
    p.dataset.slot = slot < 4 ? slot : 'x';
  });
  const advance = () => { pileOrder.push(pileOrder.shift()); paint(); };
  pile.onclick = (e) => { if (e.target.closest('.print')) { advance(); reset(); } };
  const reset = () => {
    clearInterval(pileTimer);
    if (!REDUCED) pileTimer = setInterval(advance, 5200);
  };
  paint(); reset();
}

/* ── Work filters ─────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const bar = chip.closest('.filters');
  const plate = chip.closest('.plate');
  [...bar.querySelectorAll('.chip')].forEach(c => c.classList.toggle('on', c === chip));
  const kind = chip.dataset.kind;
  const cells = [...plate.querySelectorAll('.jobs .piece')];
  cells.forEach(c => { c.hidden = !!kind && c.dataset.kind !== kind; });
  /* re-queue the survivors so the grid rebuilds in order */
  const shown = cells.filter(c => !c.hidden);
  shown.forEach((c, i) => { c.style.setProperty('--i', i); c.classList.remove('piece'); });
  void plate.offsetWidth;
  shown.forEach(c => c.classList.add('piece'));
});

/* ── Lifting a job off the pile ───────────────────────────── */
let galIdx = 0, galItems = [];
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.job');
  if (!btn || btn.dataset.flat === '1') return;
  const plate = btn.closest('.plate');
  const sec = sections[+plate.dataset.i];
  openLift((sec.items || [])[+btn.dataset.job]);
});

function openLift(job){
  if (!job) return;
  galItems = (job.gallery || []).filter(g => g && g.src);
  galIdx = 0;
  const facts = [
    ...(job.role ? [{ k: 'ROLE', v: job.role }] : []),
    ...(job.kind ? [{ k: 'TYPE', v: job.kind }] : []),
    ...(job.year ? [{ k: 'YEAR', v: job.year }] : []),
    ...(job.client ? [{ k: 'CLIENT', v: job.client }] : []),
    ...(job.meta || [])
  ];
  $('liftSheet').innerHTML = `
    <button class="lift-close" id="liftClose">CLOSE ✕</button>
    <div class="eyebrow">${esc(job.kind || 'WORK')}</div>
    <h3>${esc(job.title || '')}</h3>
    ${slateHtml(facts)}
    ${galItems.length ? `<div class="gal" id="gal">
      ${frameHtml(galItems[0], { natural: true, cls: 'l4' })}
      ${galItems.length > 1 ? `<div class="gal-nav">
        <button data-step="-1" aria-label="Previous image"><span>◀ PREV</span></button>
        <button data-step="1" aria-label="Next image"><span>NEXT ▶</span></button>
      </div><div class="gal-count">1 / ${galItems.length}</div>` : ''}
    </div>` : ''}
    ${job.writeup ? `<div class="body-copy">${paras(String(job.writeup).split(/\n{2,}/))}</div>` : ''}`;
  const lift = $('lift');
  lift.hidden = false;
  requestAnimationFrame(() => lift.classList.add('open'));
  $('liftClose').focus();
}
function galGo(step){
  if (galItems.length < 2) return;
  galIdx = (galIdx + step + galItems.length) % galItems.length;
  const gal = $('gal');
  gal.querySelector('.frame').outerHTML = frameHtml(galItems[galIdx], { natural: true, cls: 'l4' });
  gal.querySelector('.gal-count').textContent = `${galIdx + 1} / ${galItems.length}`;
}
function closeLift(){
  const lift = $('lift');
  lift.classList.remove('open');
  setTimeout(() => { lift.hidden = true; $('liftSheet').innerHTML = ''; }, REDUCED ? 0 : 300);
}
$('lift').addEventListener('click', (e) => {
  if (e.target.id === 'lift') return closeLift();
  if (e.target.closest('#liftClose')) return closeLift();
  const step = e.target.closest('[data-step]');
  if (step) galGo(+step.dataset.step);
});

/* ── Keys. Arrows walk the sections; while a job is lifted
   they walk its gallery instead. ──────────────────────────── */
addEventListener('keydown', (e) => {
  const lifted = !$('lift').hidden;
  if (lifted) {
    if (e.key === 'Escape') closeLift();
    if (e.key === 'ArrowLeft') galGo(-1);
    if (e.key === 'ArrowRight') galGo(1);
    return;
  }
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { go(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { go(cur - 1); e.preventDefault(); }
  if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
});

setSun(DEFAULT_SUN);
boot();
</script>
</body>
